{% extends "base.html" %}
{% block content %}
<div class="sheet">
  <div class="sheet-content" style="text-align:center; max-width: 420px;">
    <h2 style="margin: 0 0 16px 0; font-size: 20px; color: var(--danger);">Delete Assignment</h2>
    
    <div style="background: rgba(239, 68, 68, 0.1); padding: 16px; border-radius: 12px; margin-bottom: 20px;">
      <p style="margin: 0 0 8px 0; font-size: 14px; color: var(--muted);">You are about to delete:</p>
      <p style="margin: 0; font-size: 18px; font-weight: 600; color: var(--text);">"{{ assignment.title }}"</p>
      {% if assignment.course %}
        <p style="margin: 8px 0 0 0; font-size: 14px; color: var(--muted);">{{ assignment.course }}</p>
      {% endif %}
    </div>
    
    <p style="margin: 0 0 24px 0; font-size: 14px; color: var(--muted); line-height: 1.5;">
      This action cannot be undone. The assignment will be permanently removed from your list.
    </p>
    
    <div class="row" style="justify-content: center; gap: 12px;">
      <a href="{{ url_for('index') }}" class="btn-secondary" style="padding: 12px 24px;">Cancel</a>
      <form method="POST" style="margin: 0;">
        <button type="submit" class="btn-primary" style="background: var(--danger); padding: 12px 24px; color: rgb(255, 255, 255);">Delete</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
